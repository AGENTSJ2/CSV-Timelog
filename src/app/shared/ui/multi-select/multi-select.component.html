<span class="field-label">{{ label() }}</span>

<div class="select-shell">
  <button
    type="button"
    class="select-trigger"
    [class.is-empty]="!value().length"
    [disabled]="disabled() || !options().length"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-label]="label() + ': ' + summary()"
    aria-haspopup="listbox"
    (click)="toggleOpen()"
  >
    <span class="select-summary">{{ summary() }}</span>

    @if (value().length) {
      <span class="clear-chip" role="button" tabindex="0" aria-label="Clear selection"
            (click)="clear($event)" (keydown.enter)="clear($event)">×</span>
    }

    <span class="caret" aria-hidden="true"></span>
  </button>

  @if (isOpen()) {
    <div class="select-menu" role="listbox" aria-multiselectable="true">
      @for (option of options(); track option.value) {
        <label class="option" role="option" [attr.aria-selected]="isSelected(option)">
          <input
            type="checkbox"
            [checked]="isSelected(option)"
            (change)="toggleOption(option)"
          />
          <span class="option-value">{{ option.value }}</span>
          <span class="option-count">{{ option.count }}</span>
        </label>
      } @empty {
        <p class="option-empty">Upload a file to see options.</p>
      }
    </div>
  }
</div>
