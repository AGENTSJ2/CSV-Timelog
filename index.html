<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSV Transformer</title>
  
  <link rel="stylesheet" href="style.css" />
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  <main class="container">
    <header>
      <h2>CSV Transformer</h2>
      <p>Upload your raw CSV to format and download the transformed version.</p>
    </header>

    <div class="upload-section">
      <input type="file" id="fileInput" accept=".csv" />
      <button id="processBtn" class="primary-btn">Process CSV</button>
    </div>

    <div class="output-section">
      <h3>JSON Preview</h3>
      <pre id="output">Your transformed data will appear here...</pre>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
